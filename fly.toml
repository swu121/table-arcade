app = "tablearcade"
primary_region = "sea"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Every game, challenge and ticket lives in memory. Stopping the machine wipes
  # the room mid-pitch, so this one stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
