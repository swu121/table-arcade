app = "tablearcade"
primary_region = "iad"

# A deploy is SIGTERM, then this long before the machine is killed. The server
# uses it to snapshot every room (games, challenges, threads, who's seated) to
# the store, tell every tablet it's restarting, and exit — bounded at 8s on its
# side, so it always fits. The next boot reads the snapshot back and the
# tablets reconnect to the same game. The default (5s) is too tight for that.
kill_timeout = "10s"

[build]

[env]
  PORT = "3000"
  # DATABASE_URL is a secret, not an env entry:
  #   fly secrets set DATABASE_URL=postgres://...
  # With it set, venues, floor plans and tickets live in Postgres and survive a
  # deploy; migrations run at boot and `fly ssh console -C "npm run seed"` adds
  # the venues from docs/venues.example.json. Without it the server falls back
  # to JSON files under data/ (gone on the next deploy) with tickets in memory.
  # There is deliberately no volume.
  #
  # ADMIN_EMAIL and ADMIN_PASSWORD_HASH are the platform operator — one login
  # for the whole server, which is how /admin onboards a restaurant without a
  # deploy. Both are secrets:
  #   npm run admin:hash
  #   fly secrets set ADMIN_EMAIL=you@example.com ADMIN_PASSWORD_HASH='scrypt:...'
  # The hash is the same scrypt:N:r:p:salt:hash format staff passwords use.
  # With neither set, a production server has no /admin at all (it 404s and
  # says so once at boot); outside production, /admin is simply open.

[http_service]
  internal_port = 3000
  force_https = true
  # Every game, challenge and chat thread lives in memory. A deploy carries
  # them across (see kill_timeout), but a machine stopped for being idle would
  # need a tablet to wake it and its snapshot would be stale by then — so this
  # one stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# One machine, deliberately. Every room — who is seated, live games, chat —
# lives in that machine's memory, so a second one would be a second, separate
# floor: two tablets in the same venue could land on different machines and
# never see each other. Deploy with --ha=false; scale by venue, not by machine.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
